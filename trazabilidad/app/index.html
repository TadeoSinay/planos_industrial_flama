/* Layout: barra lateral grafito con los módulos · barra superior con búsqueda global · contenido en tablas densas ·

:root {

  --blue-soft: #E2EDF6;
  --violet: #6A4C93;
  --violet-soft: #EEE8F6;
  --side: #15191C;

  --side-ink: #E9EDEF;

  --red: #FF6A5C; --red-soft: #3A1A18; --yellow: #F2C230; --yellow-soft: #3A3014; --green: #4CC27D; --green-soft: #15301F;
  --blue: #6DB2E6; --blue-soft: #15283A; --violet: #B79BE0; --violet-soft: #2A2238; --side: #0A0D0F; --side-2: #161B1F; --sel: #2E2914;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 12px 32px rgb(0 0 0 / 45%); color-scheme: dark } }
:root[data-theme="dark"] {

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); margin: 0 }

/* ---------- estructura */

.principal { min-width: 0; display: flex; flex-direction: column }
.superior { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)) }

.res-busqueda button:hover { background: var(--surface-2) }
.periodo { font: 600 13px/1 var(--f-body); color: var(--ink-2); white-space: nowrap }
.usuario { display: flex; align-items: center; gap: 8px; margin-left: auto; white-space: nowrap; font-size: 13px }

.prueba { font: 600 10.5px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--yellow); background: var(--yellow-soft); padding: 5px 7px; border-radius: 4px; white-space: nowrap }
.contenido { padding-block: 20px 40px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; min-width: 0 }
.cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.cab h1 { font: 700 30px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .lateral { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px max(10px, env(safe-area-inset-left, 0px)) }

  .grupo-nav a { white-space: nowrap } .grupo-nav a svg { display: none }
  .app { background: none } .superior { flex-wrap: wrap } .usuario span { display: none } .buscar { order: 9; flex-basis: 100%; max-width: none }
}

/* ---------- piezas */
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 12px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; white-space: nowrap }
.btn:hover { border-color: var(--ink-3) }
.btn.pri { background: var(--red); border-color: var(--red); color: #fff }
.btn.ok { background: var(--green); border-color: var(--green); color: #fff }
.btn.sm { padding: 4px 9px; font-size: 12px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0 }
.panel > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.panel > header h2 { font: 700 17px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase }
.panel > .cuerpo { padding: 12px 14px }
.grilla { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)) }
.c4 { grid-column: span 4 } .c5 { grid-column: span 5 } .c6 { grid-column: span 6 } .c7 { grid-column: span 7 } .c8 { grid-column: span 8 } .c12 { grid-column: span 12 }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; border-left: 4px solid var(--line); text-decoration: none; color: inherit }
.kpi.ok { border-left-color: var(--green) } .kpi.av { border-left-color: var(--yellow) } .kpi.no { border-left-color: var(--red) } .kpi.in { border-left-color: var(--blue) }
.kpi span { font-size: 12px; color: var(--ink-2) }
.kpi b { font: 700 28px/1.05 var(--f-display); font-variant-numeric: tabular-nums }
.kpi small { font-size: 11.5px; color: var(--ink-3) }
.tscroll { overflow-x: auto; min-width: 0 }
table.t { width: 100%; border-collapse: collapse; font-size: 13px }
.t th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1.5px solid var(--line); white-space: nowrap; background: var(--surface) }
.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
.t tr.click { cursor: pointer }
.t tr.click:hover td { background: var(--surface-2) }
.t tr.sel td { background: var(--sel) }
.t td.nw, .t th.nw, .t td.mono { white-space: nowrap }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 11.5px/1 var(--f-body); padding: 4px 8px; border-radius: 999px; white-space: nowrap }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.pill.ok { background: var(--green-soft); color: var(--green) }
.pill.no { background: var(--red-soft); color: var(--red) }
.pill.av { background: var(--yellow-soft); color: var(--yellow) }
.pill.in { background: var(--blue-soft); color: var(--blue) }
.pill.vi { background: var(--violet-soft); color: var(--violet) }
.pill.gr { background: var(--surface-2); color: var(--ink-2) }
.barra { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 80px }
.barra i { display: block; height: 100%; background: var(--blue) }
.filtros { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.filtros button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-2) }
.filtros button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.filtros input, .filtros select { border: 1.5px solid var(--line); border-radius: 7px; padding: 5px 9px; background: var(--surface); font-size: 13px; min-width: 0 }
.campo { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2) }
.campo input, .campo select, .campo textarea { border: 1.5px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--surface); color: var(--ink); min-width: 0; font-size: 13.5px }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.form .ancho { grid-column: 1 / -1 }
.aviso { border-radius: 8px; padding: 9px 11px; font-size: 13px }
.aviso.ok { background: var(--green-soft); color: var(--green) } .aviso.no { background: var(--red-soft); color: var(--red) }
.aviso.av { background: var(--yellow-soft); color: var(--ink) } .aviso.in { background: var(--blue-soft); color: var(--blue) }
.dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 0; font-size: 13px }
.dl dt { color: var(--ink-3) } .dl dd { margin: 0; min-width: 0 }
.lista-alertas { list-style: none; margin: 0; padding: 0 }
.lista-alertas li { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: start; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px }
.lista-alertas li:last-child { border: 0 }
.lista-alertas li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--yellow) }
.lista-alertas li.no::before { background: var(--red) } .lista-alertas li.in::before { background: var(--blue) }
.etapas { display: flex; gap: 2px; flex-wrap: wrap }
.etapas span { font: 600 11px/1 var(--f-body); padding: 6px 8px; background: var(--surface-2); color: var(--ink-3); border-radius: 4px }
.etapas span.hecha { background: var(--green-soft); color: var(--green) }
.etapas span.actual { background: var(--ink); color: var(--bg) }

.paginas { display: flex; gap: 6px; align-items: center; justify-content: flex-end; padding: 10px 14px; font-size: 12.5px; color: var(--ink-3) }

/* panel de detalle */
.velo { position: fixed; inset: 0; background: rgb(10 13 15 / 38%); z-index: 40 }

.graf { width: 100%; height: auto; display: block }

.graf .t-ink { fill: var(--ink) }

</style>

<script>
// ================================================================ utilidades
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n0 = x => Math.round(x).toLocaleString("es-AR");
const nf = (x, d = 1) => Number(x).toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (a, b) => b ? nf(100 * a / b, 1) + " %" : "—";
const AA = String(D.anio).slice(2);
const ser = n => `${AA}-${String(n).padStart(6, "0")}`;
const numSerie = s => { const m = String(s).match(/^(\d{2})-?(\d{6})$/); return m && m[1] === AA ? +m[2] : null; };

// fecha de trabajo: hoy si cae en el mes del plan; si no, el día 23 del mes del plan
const HOY = (() => { const h = new Date(); return h.getFullYear() === D.anio && h.getMonth() + 1 === D.mes ? new Date(D.anio, D.mes - 1, h.getDate()) : new Date(D.anio, D.mes - 1, 23); })();
const fecha = d => d ? new Date(d).toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "2-digit" }) : "—";
const dias = (a, b = HOY) => Math.round((new Date(b) - new Date(a)) / 864e5);
const sumar = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function habiles(anio, mes) { const out = []; for (let d = 1; d <= 31; d++) { const x = new Date(anio, mes - 1, d); if (x.getMonth() !== mes - 1) break; if (x.getDay() % 6) out.push(x); } return out; }

function buscar(q) {
  q = q.trim(); if (q.length < 2) return [];
  const Q = q.toUpperCase(), out = [];
  const n = numSerie(Q) ?? (/^\d{3,6}$/.test(Q) ? +Q : null);
  if (n && ordenDe(n)) out.push(["Equipo", ser(n), () => abrirDetalle("equipo", n)]);
  S.ordenes.filter(o => o.op.replace(/\s/g, "").includes(Q.replace(/\s/g, ""))).slice(0, 5).forEach(o => out.push(["Orden", `${o.op} · ${o.modelo}`, () => abrirDetalle("orden", o.op)]));
  S.remitos.filter(r => r.id.replace(/\s/g, "").includes(Q.replace(/\s/g, ""))).slice(0, 4).forEach(r => out.push(["Remito", `${r.id} · ${cliente(r.cliente).nombre}`, () => abrirDetalle("remito", r.id)]));
  S.clientes.filter(c => c.nombre.toUpperCase().includes(Q) || c.cuit.includes(q)).slice(0, 4).forEach(c => out.push(["Cliente", c.nombre, () => abrirDetalle("cliente", c.id)]));
  S.recargas.filter(r => r.os.includes(Q) || r.etiqueta.includes(Q)).slice(0, 4).forEach(r => out.push(["Recarga", `${r.os} · ${r.tipo}`, () => abrirDetalle("recarga", r.os)]));
  D.insumos.filter(m => m.cod.toUpperCase().includes(Q) || m.mat.toUpperCase().includes(Q)).slice(0, 4).forEach(m => out.push(["Insumo", `${m.cod} · ${m.mat}`, () => abrirDetalle("insumo", m.cod)]));
  S.ordenes.filter(o => Object.values(o.insumos).includes(Q)).slice(0, 1).forEach(() => out.push(["Lote MP", `${Q}: órdenes que lo usaron`, () => abrirDetalle("loteMP", Q)]));
  return out.slice(0, 12);
}

    return `<div class="grilla"><div class="panel c8"><header><div class="filtros">${lotes.map(l => `<button aria-pressed="${l.op === o.op}" data-a="etqLote" data-id="${l.op}">${l.op} · ${esc(l.modelo)}</button>`).join("")}</div><span class="muted">${o.etiquetados} de ${aptas.length}</span></header>

      <div class="filtros"><button data-a="leerSig" ${falta.length ? "" : "disabled"}>Lectura del siguiente</button>${o.rech.length ? `<button data-a="leerRech">Lectura de un rechazo</button>` : ""}<button data-a="leerTodo" ${falta.length ? "" : "disabled"}>Leer los ${falta.length} restantes</button></div>
      ${u ? `<div class="aviso ${u.ok ? "ok" : "no"}">${u.ok ? `✓ ${ser(u.n)} · etiqueta impresa · estampilla ${estampilla(u.n)}` : `✗ ${esc(u.s)} · ${esc(u.motivo)}`}</div>` : ""}
      ${!falta.length ? `<div class="aviso ok">Lote completo. <button class="btn sm ok" data-a="aDeposito" data-id="${o.op}">Pasar a depósito PT</button></div>` : ""}</div></div>
      <div class="panel c4"><header><h2>Últimas etiquetas</h2></header><div class="cuerpo" style="display:flex;flex-direction:column;gap:8px">${hechas.slice(-3).reverse().map(n => etiqueta(n, o)).join("") || `<p class="muted" style="margin:0">Todavía no se imprimió ninguna.</p>`}</div></div></div>`;
  },
};
function leer(txt) {
  const o = S.ordenes.find(x => x.op === UI.f.etqOp), n = numSerie(String(txt).trim().replace(/^N°\s*/, ""));
  const rechSet = new Set(o.rech.map(x => x.n)), aptas = Array.from({ length: o.cant }, (_, i) => o.desde + i).filter(k => !rechSet.has(k));
  if (n == null || n < o.desde || n > o.hasta) UI.f.etqUlt = { ok: false, s: txt, motivo: "no pertenece al lote abierto" };
  else if (rechSet.has(n)) { UI.f.etqUlt = { ok: false, s: ser(n), motivo: "bloqueado: " + o.rech.find(x => x.n === n).causa }; registrar("Bloqueo en etiquetado", ser(n)); }
  else if (aptas.indexOf(n) < o.etiquetados) UI.f.etqUlt = { ok: false, s: ser(n), motivo: "ya tiene etiqueta; reimpresión solo con supervisor" };
  else { o.etiquetados = Math.max(o.etiquetados, aptas.indexOf(n) + 1); UI.f.etqUlt = { ok: true, n }; registrar("Equipo identificado", ser(n), "estampilla " + estampilla(n)); }
  pintar(); const i = $("#lectura"); if (i) i.focus();
}

// ================================================================ gestión: tablero, desvíos, insumos, reportes y configuración
function estadoInsumo(m) {
  const st = S.insumos[m.cod], dia = m.anio26 / 240, plazo = +(m.pmax || m.pmin || 10);
  if (!dia) return { k: "gr", t: "sin consumo en " + D.anio, cob: null };
  const cob = st.stock / dia;
  // criterio: pedir cuando la cobertura no llega al plazo máximo más la mitad
  return cob < plazo ? { k: "no", t: "pedir ya", cob } : cob < plazo * 1.5 ? { k: "av", t: "pedir", cob } : { k: "ok", t: "ok", cob };
}

VISTAS.tablero = {
  titulo: "Tablero",
  sub: () => `${HOY.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}`,
  html() {
    const om = S.ordenes.filter(o => o.mes === D.mes), plan = D.plan.filter(p => p.tipo === "Terminado").reduce((a, p) => a + p.cant, 0);
    const hechos = om.filter(o => o.etapa >= E["Depósito PT"]).reduce((a, o) => a + aptos(o), 0);
    const cerr = om.filter(o => o.etapa >= E["Para etiquetar"]), tot = cerr.reduce((a, o) => a + o.cant, 0), rech = cerr.reduce((a, o) => a + o.rech.length, 0);
    const hab = habiles(D.anio, D.mes), trans = hab.filter(d => d <= HOY).length, esperado = Math.round(plan * trans / hab.length);
    const pt = S.ordenes.filter(o => o.etapa === E["Depósito PT"]).reduce((a, o) => a + aptos(o), 0);
    const alertas = [];
    S.medicion.forEach(m => { const f = m.cada - dias(m.ult); if (f < 0) alertas.push(["no", `${m.id}: control vencido hace ${-f} días`, "calidad"]); else if (f <= 3) alertas.push(["av", `${m.id}: el contraste vence en ${f} día${f === 1 ? "" : "s"}`, "calidad"]); });
    S.reclamos.filter(vencido).forEach(x => alertas.push(["no", `${x.id} (${x.tipo.toLowerCase()}) fuera de plazo`, "reclamos"]));
    S.remitos.filter(r => r.estado === "Sin confirmar").forEach(r => alertas.push(["av", `${r.id}: recepción sin confirmar hace ${dias(r.fecha)} días`, "expedicion"]));
    S.ordenes.filter(o => o.etapa === E["Para cerrar"]).forEach(o => alertas.push(["in", `${o.op} terminó carga: falta cerrar el lote`, "calidad"]));
    const ped = D.insumos.filter(m => estadoInsumo(m).k === "no"); if (ped.length) alertas.push(["no", `${ped.length} insumos debajo del plazo de reposición`, "insumos"]);
    S.recargas.filter(r => r.inutil).forEach(r => alertas.push(["av", `${r.os}: labrar acta de inutilización`, "recargas"]));
    // avance diario: aptos acumulados por fecha de cierre contra el plan lineal
    const W = 640, H = 200, l = 40, rr = 16, t = 12, b = 26, X = i => l + (W - l - rr) * i / (hab.length - 1), Y = v => t + (H - t - b) * (1 - v / plan);
    let ac = 0; const real = hab.filter(d => d <= HOY).map((d, i) => { ac += om.filter(o => o.cierre && new Date(o.cierre).toDateString() === d.toDateString()).reduce((a, o) => a + aptos(o), 0); return [X(i), Y(Math.min(ac, plan)), ac, d]; });
    const graf = `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Avance de producción del mes">${[0, .5, 1].map(f => `<line x1="${l}" x2="${W - rr}" y1="${Y(plan * f)}" y2="${Y(plan * f)}" class="grid"/><text x="${l - 6}" y="${Y(plan * f) + 4}" text-anchor="end">${n0(plan * f)}</text>`).join("")}
      <line x1="${X(0)}" y1="${Y(0)}" x2="${X(hab.length - 1)}" y2="${Y(plan)}" stroke="var(--ink-3)" stroke-dasharray="4 4" stroke-width="1.5"/>
      <path d="${real.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("")}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>
      ${real.length ? `<circle cx="${real[real.length - 1][0]}" cy="${real[real.length - 1][1]}" r="4.5" fill="var(--blue)" stroke="var(--surface)" stroke-width="2"/><text x="${real[real.length - 1][0] + 8}" y="${real[real.length - 1][1] - 6}" class="t-ink" style="font-weight:600">${n0(real[real.length - 1][2])}</text>` : ""}
      <text x="${l}" y="${H - 6}">1 ${MES_TXT[D.mes - 1].slice(0, 3)}</text><text x="${W - rr}" y="${H - 6}" text-anchor="end">plan ${n0(plan)} (punteado)</text></svg>`;

      <dl class="dl"><dt>Fabricado</dt><dd>${fecha(e.fab)}</dd><dt>Mantenimiento</dt><dd>vence ${fecha(e.mant)}</dd><dt>Prueba hidráulica</dt><dd>vence ${fecha(e.phVence)}</dd><dt>Vida útil</dt><dd>hasta ${fecha(e.vida)}</dd></dl></div></div>
      <p class="muted" style="margin:0;font-size:12.5px">Revisalo una vez por mes: precinto y seguro puestos, aguja del manómetro en verde, sin golpes ni óxido, tarjeta oficial sana. Para servicio o reclamos, contactá a tu distribuidor o a FLAMA con este número.</p>`}</main>`;
}

const ruta = location.pathname.match(/\/m\/([^/]+)\/?$/);
if (ruta) paginaPublica(decodeURIComponent(ruta[1]));
else {
  const h = location.hash.slice(1);
  UI.vista = VISTAS[h] ? h : "tablero";
  window.addEventListener("hashchange", () => { const k = location.hash.slice(1); if (VISTAS[k] && k !== UI.vista) ir(k); });
  pintar();
}

</script>

/* Layout: barra lateral grafito con los módulos · barra superior con búsqueda global · contenido en tablas densas ·

:root {

  --side: #15191C;

  --side-ink: #E9EDEF;

  --red: #FF6A5C; --red-soft: #3A1A18; --yellow: #F2C230; --yellow-soft: #3A3014; --green: #4CC27D; --green-soft: #15301F;
  --blue: #6DB2E6; --blue-soft: #15283A; --violet: #B79BE0; --violet-soft: #2A2238; --side: #0A0D0F; --side-2: #161B1F; --sel: #2E2914;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 12px 32px rgb(0 0 0 / 45%); color-scheme: dark } }
:root[data-theme="dark"] {

* { box-sizing: border-box }

body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); margin: 0 }

/* ---------- estructura */

.principal { min-width: 0; display: flex; flex-direction: column }
.superior { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)) }

.res-busqueda button:hover { background: var(--surface-2) }
.periodo { font: 600 13px/1 var(--f-body); color: var(--ink-2); white-space: nowrap }
.usuario { display: flex; align-items: center; gap: 8px; margin-left: auto; white-space: nowrap; font-size: 13px }

.prueba { font: 600 10.5px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--yellow); background: var(--yellow-soft); padding: 5px 7px; border-radius: 4px; white-space: nowrap }
.contenido { padding-block: 20px 40px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; min-width: 0 }
.cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.cab h1 { font: 700 30px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase }

@media (max-width: 900px) {

  .app { background: none } .superior { flex-wrap: wrap } .usuario span { display: none } .buscar { order: 9; flex-basis: 100%; max-width: none }
}

/* ---------- piezas */
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 12px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; white-space: nowrap }
.btn:hover { border-color: var(--ink-3) }
.btn.pri { background: var(--red); border-color: var(--red); color: #fff }
.btn.ok { background: var(--green); border-color: var(--green); color: #fff }
.btn.sm { padding: 4px 9px; font-size: 12px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0 }
.panel > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.panel > header h2 { font: 700 17px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; border-left: 4px solid var(--line); text-decoration: none; color: inherit }
.kpi.ok { border-left-color: var(--green) } .kpi.av { border-left-color: var(--yellow) } .kpi.no { border-left-color: var(--red) } .kpi.in { border-left-color: var(--blue) }

.tscroll { overflow-x: auto; min-width: 0 }

.t th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1.5px solid var(--line); white-space: nowrap; background: var(--surface) }
.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
.t tr.click { cursor: pointer }
.t tr.click:hover td { background: var(--surface-2) }
.t tr.sel td { background: var(--sel) }
.t td.nw, .t th.nw, .t td.mono { white-space: nowrap }

.pill.gr { background: var(--surface-2); color: var(--ink-2) }
.barra { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 80px }
.barra i { display: block; height: 100%; background: var(--blue) }
.filtros { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.filtros button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-2) }
.filtros button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }

.campo { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2) }
.campo input, .campo select, .campo textarea { border: 1.5px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--surface); color: var(--ink); min-width: 0; font-size: 13.5px }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.form .ancho { grid-column: 1 / -1 }
.aviso { border-radius: 8px; padding: 9px 11px; font-size: 13px }
.aviso.ok { background: var(--green-soft); color: var(--green) } .aviso.no { background: var(--red-soft); color: var(--red) }
.aviso.av { background: var(--yellow-soft); color: var(--ink) } .aviso.in { background: var(--blue-soft); color: var(--blue) }
.dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 0; font-size: 13px }
.dl dt { color: var(--ink-3) } .dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere }

.lista-alertas { list-style: none; margin: 0; padding: 0 }

.lista-alertas li:last-child { border: 0 }
.lista-alertas li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--yellow) }
.lista-alertas li.no::before { background: var(--red) } .lista-alertas li.in::before { background: var(--blue) }

async function sha256(t) {

function buscar(q) {
  q = q.trim(); if (q.length < 2) return [];
  const Q = q.toUpperCase(), out = [];
  const n = numSerie(Q) ?? (/^\d{3,6}$/.test(Q) ? +Q : null);
  if (n && ordenDe(n)) out.push([tipoEq(ordenDe(n)), `${ser(n)} · ${ordenDe(n).modelo}`, () => ir("equipo", n)]);
  S.recargas.filter(r => r.etiqueta.includes(Q) || r.nro === q).slice(0, 3).forEach(r => out.push(["Servicio", `${r.etiqueta} · ${r.tipo}`, () => ir("equipo", r.etiqueta)]));
  S.ordenes.filter(o => o.op.replace(/\s/g, "").includes(Q.replace(/\s/g, ""))).slice(0, 5).forEach(o => out.push(["Lote", `${o.op} · ${o.modelo}`, () => ir("lote", o.op)]));
  S.remitos.filter(r => r.id.replace(/\s/g, "").includes(Q.replace(/\s/g, ""))).slice(0, 4).forEach(r => out.push(["Remito", `${r.id} · ${cliente(r.cliente).nombre}`, () => abrirDetalle("remito", r.id)]));
  S.clientes.filter(c => c.nombre.toUpperCase().includes(Q) || c.cuit.includes(q)).slice(0, 4).forEach(c => out.push(["Cliente", c.nombre, () => abrirDetalle("cliente", c.id)]));
  S.recargas.filter(r => r.os.includes(Q) || r.etiqueta.includes(Q)).slice(0, 4).forEach(r => out.push(["Recarga", `${r.os} · ${r.tipo}`, () => abrirDetalle("recarga", r.os)]));
  D.insumos.filter(m => m.cod.toUpperCase().includes(Q) || m.mat.toUpperCase().includes(Q)).slice(0, 4).forEach(m => out.push(["Insumo", `${m.cod} · ${m.mat}`, () => abrirDetalle("insumo", m.cod)]));
  const mp = [...new Set(S.ordenes.flatMap(o => Object.values(o.insumos).map(v => v.split(" · ")[0])))].filter(v => v.includes(Q)).slice(0, 3);
  mp.forEach(v => out.push(["Lote MP", `${v}: órdenes y equipos que lo usaron`, () => { UI.f.trq = v; ir("traza"); }]));
  return out.slice(0, 12);
}

function leer(txt) {

  else if (rechSet.has(n)) { UI.f.etqUlt = { ok: false, s: ser(n), motivo: "bloqueado: " + o.rech.find(x => x.n === n).causa }; registrar("Bloqueo en etiquetado", ser(n)); }
  else if (aptas.indexOf(n) < o.etiquetados) UI.f.etqUlt = { ok: false, s: ser(n), motivo: "ya tiene etiqueta; reimpresión solo con supervisor" };
  else { o.etiquetados = Math.max(o.etiquetados, aptas.indexOf(n) + 1); UI.f.etqUlt = { ok: true, n }; registrar("Equipo identificado", ser(n), "estampilla " + estampilla(n)); }

}

ACC.aDeposito = el => { const o = S.ordenes.find(x => x.op === el.dataset.id); o.etapa = E["Depósito PT"]; o.cierre = HOY; registrar("Ingreso a depósito PT", o.op, `${aptos(o)} equipos`); toast(`${o.op} en depósito PT`); pintar(); };

// ---------------------------------------------------------------- historial de lotes
const ciclo = o => o.emision && o.cierre ? Math.max(1, dias(o.emision, o.cierre)) : null;
function stats(v) { const n = v.length; if (!n) return null; const m = v.reduce((a, x) => a + x, 0) / n; const sd = Math.sqrt(v.reduce((a, x) => a + (x - m) ** 2, 0) / Math.max(1, n - 1)); return { n, m, sd }; }
const cpk = (st, lie, lse) => st && st.sd ? Math.min(lse - st.m, st.m - lie) / (3 * st.sd) : null;
function distribucion(o) {
  const c = {}; for (let n = o.desde; n <= o.hasta; n++) { const e = equipo(n); c[e.estado] = (c[e.estado] || 0) + 1; } return c;
}

        <td class="nw">${fecha(o.emision)}</td><td class="nw">${fecha(o.cierre)}</td><td class="num">${ciclo(o) ? ciclo(o) + " d" : "—"}</td><td>${pill(ETAPAS[o.etapa], etapaPill(o.etapa))}</td><td class="mono">${o.remito || "—"}</td></tr>`))}

  },
};

  return f ? D.insumos.find(f) : null; };
VISTAS.lote = {
  titulo: () => esc(UI.param),
  sub: () => { const o = S.ordenes.find(x => x.op === UI.param); return o ? `${esc(o.modelo)} · ${tipoEq(o).toLowerCase()} · ${o.cant} u · línea ${o.linea.toLowerCase()} · partida ${o.partida} · ${pill(ETAPAS[o.etapa], etapaPill(o.etapa))}` : ""; },
  acciones: () => { const o = S.ordenes.find(x => x.op === UI.param); if (!o) return "";

      <div class="kpi in"><span>Estampillas DPS</span><b class="mono" style="font-size:16px">${cerr ? estampilla(o.desde) : "—"}</b><small>${cerr ? "a " + estampilla(o.hasta) : "al identificar"}</small></div>

    if (tab === "hoja") cuerpo = `<div class="panel"><header><h2>Hoja de ruta</h2><span class="muted">papel firmado en el carro · foto al cierre · se carga en la base</span></header>${tabla(["Puesto", "Operación", "Equipo", "Lote anotado", "Fecha y hora", "Firma", "Estado"], hojaRuta(o).map(h => `<tr><td class="mono">${h.puesto}</td><td>${esc(h.op)}</td><td class="muted">${esc(h.equipo)}</td><td class="mono">${esc(h.insumo || "—")}</td><td class="nw">${h.fecha ? h.fecha.toLocaleString("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—"}</td><td>${esc(h.firma || "—")}</td><td>${pill(h.estado, h.estado === "hecho" ? "ok" : h.estado === "en curso" ? "av" : "gr")}</td></tr>`))}</div>`;

ACC.rcDesvio = el => { const x = S.reclamos.find(r => r.id === el.dataset.id); const d = { id: `RD-${AA}-${String(S.nRd++).padStart(3, "0")}`, fecha: HOY, origen: "Cliente", que: x.texto, ref: x.id, sev: x.tipo === "Seguridad" ? "Mayor" : "Menor", resp: "Calidad", estado: "Abierto", causa: "", accion: "" };

// ================================================================ tablero técnico: intraplanta y extraplanta
// ---------------------------------------------------------------- gráficos SVG (un eje, marcas finas, valores en el texto)
function cartaI(v, lie, lse, etiquetas = []) {
  const st = stats(v); if (!st) return `<p class="muted">Sin datos</p>`;
  const mr = v.slice(1).map((x, i) => Math.abs(x - v[i])), mrb = mr.reduce((a, x) => a + x, 0) / Math.max(1, mr.length);
  const lcs = st.m + 2.66 * mrb, lci = st.m - 2.66 * mrb, lo = Math.min(lie, lci, ...v) - (lse - lie) * 0.05, hi = Math.max(lse, lcs, ...v) + (lse - lie) * 0.05;
  const W = 760, H = 230, l = 46, rr = 92, t = 10, b = 22, X = i => l + (W - l - rr) * i / Math.max(1, v.length - 1), Y = y => t + (H - t - b) * (hi - y) / (hi - lo);
  const lin = (y, txt, col, dash) => `<line x1="${l}" x2="${W - rr}" y1="${Y(y)}" y2="${Y(y)}" stroke="${col}" stroke-width="1.3" ${dash ? 'stroke-dasharray="5 4"' : ""}/><text x="${W - rr + 6}" y="${Y(y) + 4}">${txt} ${nf(y, 3)}</text>`;
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carta de valores individuales">${lin(lse, "LSE", "var(--ink-3)")}${lin(lie, "LIE", "var(--ink-3)")}${lin(lcs, "LCS", "var(--red)", 1)}${lin(lci, "LCI", "var(--red)", 1)}${lin(st.m, "x̄", "var(--ink-2)")}
    <path d="${v.map((y, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(y).toFixed(1)).join("")}" fill="none" stroke="var(--blue)" stroke-width="1.4" opacity=".6"/>
    ${v.map((y, i) => { const f = y > lcs || y < lci; return `<circle cx="${X(i)}" cy="${Y(y)}" r="${f ? 4.5 : 3}" fill="${f ? "var(--red)" : "var(--blue)"}"><title>${esc(etiquetas[i] || i + 1)} · ${nf(y, 3)} kg</title></circle>`; }).join("")}
    <text x="${l}" y="${H - 4}">serie 1</text><text x="${W - rr}" y="${H - 4}" text-anchor="end">serie ${v.length}</text></svg>`;
}
function cartaP(ls) {
  if (!ls.length) return `<p class="muted">Sin lotes cerrados</p>`;
  const tot = ls.reduce((a, q) => a + q.n, 0), pb = ls.reduce((a, q) => a + q.x, 0) / tot;
  ls.forEach(q => { q.p = q.x / q.n; q.lcs = pb + 3 * Math.sqrt(pb * (1 - pb) / q.n); });
  const W = 760, H = 220, l = 42, rr = 12, t = 10, b = 34, max = Math.max(0.04, ...ls.map(q => Math.max(q.p, q.lcs))) * 1.1, bw = (W - l - rr) / ls.length;
  const X = i => l + bw * (i + 0.5), Y = y => t + (H - t - b) * (1 - y / max);
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carta p de fallas en prueba hidráulica">${[0, max / 2, max].map(y => `<line x1="${l}" x2="${W - rr}" y1="${Y(y)}" y2="${Y(y)}" class="grid"/><text x="${l - 5}" y="${Y(y) + 4}" text-anchor="end">${nf(100 * y, 1)}%</text>`).join("")}
    <line x1="${l}" x2="${W - rr}" y1="${Y(pb)}" y2="${Y(pb)}" stroke="var(--ink-2)"/><path d="${ls.map((q, i) => `${i ? "L" : "M"}${(X(i) - bw / 2).toFixed(1)} ${Y(q.lcs).toFixed(1)}H${(X(i) + bw / 2).toFixed(1)}`).join("")}" fill="none" stroke="var(--red)" stroke-dasharray="5 4" stroke-width="1.3"/>
    ${ls.map((q, i) => `<circle cx="${X(i)}" cy="${Y(q.p)}" r="${q.p > q.lcs ? 5 : 3.5}" fill="${q.p > q.lcs ? "var(--red)" : "var(--blue)"}"><title>${q.op} · ${q.x} de ${q.n} · LCS ${nf(100 * q.lcs, 1)} %</title></circle>${ls.length <= 26 ? `<text x="${X(i)}" y="${H - b + 14}" text-anchor="middle" style="font-size:9.5px">${q.op.slice(-5)}</text>` : ""}`).join("")}
    <text x="${W - rr}" y="${H - 4}" text-anchor="end">p̄ ${nf(100 * pb, 2)} % · LCS según tamaño de lote</text></svg>`;
}
function barrasH(items, color = "var(--blue)", fmt = n0) {
  const max = Math.max(1, ...items.map(x => x[1]));
  return items.map(([k, v, sub]) => `<div style="display:grid;grid-template-columns:minmax(120px,190px) 1fr 54px;gap:10px;align-items:center;margin:5px 0;font-size:13px"><span>${esc(k)}${sub ? `<br><small class="muted">${esc(sub)}</small>` : ""}</span>${barra(v, max, color)}<b class="num">${fmt(v)}</b></div>`).join("");
}
function columnas(items, color = "var(--blue)") {
  const W = 760, H = 190, l = 30, b = 26, t = 12, max = Math.max(1, ...items.map(x => x[1])), bw = (W - l) / items.length;
  return `<svg class="graf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vencimientos por mes">${items.map(([k, v], i) => { const h = (H - b - t) * v / max, x = l + i * bw + 4;
    return `<rect x="${x}" y="${H - b - h}" width="${bw - 8}" height="${Math.max(h, 1)}" rx="3" fill="${color}"><title>${k}: ${v}</title></rect><text x="${x + (bw - 8) / 2}" y="${H - b - h - 4}" text-anchor="middle" class="t-ink" style="font-size:10.5px">${v ? n0(v) : ""}</text><text x="${x + (bw - 8) / 2}" y="${H - 8}" text-anchor="middle" style="font-size:10px">${k}</text>`; }).join("")}</svg>`;
}

// ---------------------------------------------------------------- vista
VISTAS.tablero = {
  titulo: "Tablero",
  sub: () => `${HOY.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" })} · ${habiles(D.anio, D.mes).filter(d => d <= HOY).length} de ${habiles(D.anio, D.mes).length} días hábiles`,
  acciones: () => `<div class="filtros" role="tablist">${[["intra", "Trazabilidad intraplanta"], ["extra", "Trazabilidad extraplanta"]].map(([k, t]) => `<button role="tab" aria-pressed="${fil("tab", "intra") === k}" data-a="filtro" data-k="tab" data-v="${k}">${t}</button>`).join("")}</div>`,
  html() { return fil("tab", "intra") === "intra" ? tableroIntra() : tableroExtra(); },
};

function tableroIntra() {
  const om = S.ordenes.filter(o => o.mes === D.mes), planT = D.plan.filter(p => p.tipo === "Terminado" || p.tipo === "Cilindro").reduce((a, p) => a + p.cant, 0);
  const hab = habiles(D.anio, D.mes), trans = hab.filter(d => d <= HOY).length, esperado = Math.round(planT * trans / hab.length);
  const enPT = om.filter(o => o.etapa >= E["Depósito PT"]).reduce((a, o) => a + aptos(o), 0);
  const cerr = om.filter(o => o.etapa >= E["Para etiquetar"]), tot = cerr.reduce((a, o) => a + o.cant, 0), rech = cerr.reduce((a, o) => a + o.rech.length, 0);
  const phF = cerr.reduce((a, o) => a + o.rech.filter(x => x.ensayo === "PH").length, 0);
  const wip = ETAPAS.slice(1, 7).map((e, i) => [e, om.filter(o => o.etapa === i + 1).reduce((a, o) => a + o.cant, 0), om.filter(o => o.etapa === i + 1).map(o => o.op.slice(-5)).join(" ")]);
  const ciclos = S.ordenes.filter(o => ciclo(o) && o.mes >= D.mes - 1).map(ciclo), cm = ciclos.length ? ciclos.reduce((a, x) => a + x, 0) / ciclos.length : 0;
  // capacidad de proceso de la carga por modelo (lotes cerrados del mes y del anterior)
  const cap = D.modelos.map(m => { const v = []; S.ordenes.filter(o => !o.cilindro && o.mes >= D.mes - 1 && o.etapa >= E["Para etiquetar"] && modeloBOM(o.modelo) === m).forEach(o => { for (let n = o.desde; n <= o.hasta; n++) if (!o.rech.some(x => x.n === n)) v.push(masaCarga(n, o)); });
    const st = stats(v); return st ? [m, st, cpk(st, m.min, m.max)] : null; }).filter(Boolean);
  const capOk = cap.filter(c => c[1].n >= 5 && isFinite(c[2])), cpkMin = capOk.length ? Math.min(...capOk.map(c => c[2])) : null; // n < 5: muestra insuficiente para estimar σ
  const ultimo = om.filter(o => !o.cilindro && o.etapa >= E["Para etiquetar"]).sort((a, b) => b.cant - a.cant)[0];
  const masas = ultimo ? Array.from({ length: ultimo.cant }, (_, i) => ultimo.desde + i).filter(n => !ultimo.rech.some(x => x.n === n)) : [];
  const lp = S.ordenes.filter(o => o.mes >= D.mes - 1 && o.etapa >= E["Para etiquetar"] && o.cant >= 20).map(o => ({ op: o.op, n: o.cant, x: o.rech.filter(r => r.ensayo === "PH").length }));
  const causas = CAUSAS.map(([c]) => [c, cerr.reduce((a, o) => a + o.rech.filter(x => x.causa === c).length, 0)]).sort((a, b) => b[1] - a[1]);
  const lotesMP = {}; om.filter(o => o.etapa > 0).forEach(o => Object.entries(o.insumos).forEach(([k, v]) => { const key = k + "|" + v.split(" · ")[0]; const x = lotesMP[key] || (lotesMP[key] = { ops: 0, u: 0 }); x.ops++; x.u += o.cant; }));
  const medV = S.medicion.filter(m => m.cada - dias(m.ult) <= 3);
  const partidas = [...new Set(om.map(o => o.partida))];
  return `<div class="kpis">
    <div class="kpi ${enPT >= esperado * 0.95 ? "ok" : "av"}"><span>Producción a depósito PT</span><b>${n0(enPT)}</b><small>de ${n0(planT)} del plan · esperado a hoy ${n0(esperado)} (${pct(enPT, esperado)})</small></div>
    <div class="kpi in"><span>En proceso (WIP)</span><b>${n0(wip.reduce((a, w) => a + w[1], 0))}</b><small>${om.filter(o => o.etapa > 0 && o.etapa < E["Depósito PT"]).length} órdenes abiertas</small></div>
    <div class="kpi ${rech / Math.max(1, tot) < 0.02 ? "ok" : "av"}"><span>Rendimiento a la primera</span><b>${pct(tot - rech, tot)}</b><small>${rech} rechazos en ${n0(tot)} cerrados</small></div>
    <div class="kpi ${phF / Math.max(1, tot) < 0.01 ? "ok" : "av"}"><span>Fallas en PH</span><b>${pct(phF, tot)}</b><small>${phF} de ${n0(tot)} · ${nf(PH.man, 1)} / ${nf(PH.car, 1)} MPa</small></div>
    <div class="kpi ${cpkMin >= 1.33 ? "ok" : cpkMin >= 1 ? "av" : "no"}"><span>Cpk de carga (peor modelo)</span><b>${cpkMin != null ? nf(cpkMin, 2) : "—"}</b><small>meta ≥ 1,33 (criterio) · modelos con n ≥ 5</small></div>
    <div class="kpi in"><span>Ciclo medio de orden</span><b>${nf(cm, 1)} d</b><small>emisión → depósito PT</small></div>
    <div class="kpi in"><span>Partidas DPS del mes</span><b>${partidas.length}</b><small>${n0(om.reduce((a, o) => a + o.cant, 0))} series reservadas</small></div>
    <div class="kpi ${medV.length ? "av" : "ok"}"><span>Medición por vencer</span><b>${medV.length}</b><small>de ${S.medicion.length} equipos</small></div></div>
  <div class="grilla">
    <div class="panel c6"><header><h2>Equipos en cada etapa</h2><span class="muted">unidades de las órdenes del mes</span></header><div class="cuerpo">${barrasH(wip.map(([e, v, ops]) => [e, v, ops]))}<div style="display:grid;grid-template-columns:minmax(120px,190px) 1fr 54px;gap:10px;font-size:13px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px"><span>Depósito PT</span>${barra(enPT, planT, "var(--green)")}<b class="num">${n0(enPT)}</b></div></div></div>
    <div class="panel c6"><header><h2>Capacidad de proceso: carga</h2><span class="muted">BOM · banda de carga</span></header>${tabla(["Modelo", "n", "x̄ kg", "σ g", "Banda kg", "Cpk"], cap.map(([m, st, c]) => `<tr><td class="nw">${esc(m.nombre.replace("Extintor ", "").replace(/^(.*) sobre ruedas$/, "Carro $1"))}</td><td class="num">${st.n}</td><td class="num">${nf(st.m, 3)}</td><td class="num">${nf(st.sd * 1000, 0)}</td><td class="num nw">${nf(m.min, 2)}–${nf(m.max, 2)}</td><td class="num nw">${st.n < 5 || !isFinite(c) ? pill("n < 5", "gr") : pill(nf(c, 2), c >= 1.33 ? "ok" : c >= 1 ? "av" : "no")}</td></tr>`))}</div>
    <div class="panel c6"><header><h2>Carta I · masa de carga</h2><span class="muted">${ultimo ? `<a href="#" data-det="orden" data-id="${ultimo.op}">${ultimo.op}</a> · ${esc(ultimo.modelo)}` : ""}</span></header><div class="cuerpo">${ultimo ? cartaI(masas.map(n => masaCarga(n, ultimo)), modeloBOM(ultimo.modelo).min, modeloBOM(ultimo.modelo).max, masas.map(ser)) : `<p class="muted">Sin lotes cerrados</p>`}</div></div>
    <div class="panel c6"><header><h2>Carta p · fallas en PH por lote</h2><span class="muted">${MES_TXT[D.mes - 2] || ""} y ${MES_TXT[D.mes - 1]} · lotes de 20 u o más</span></header><div class="cuerpo">${cartaP(lp)}</div></div>
    <div class="panel c5"><header><h2>Rechazos por causa</h2><span class="muted">${MES_TXT[D.mes - 1]}</span></header><div class="cuerpo">${barrasH(causas, "var(--red)")}</div></div>
    <div class="panel c7"><header><h2>Lotes de insumo en uso</h2><span class="muted">${Object.keys(lotesMP).length} lotes en hojas de ruta del mes · 12 de mayor uso</span></header>${tabla(["Insumo", "Lote", "Órdenes", "Equipos"], Object.entries(lotesMP).sort((a, b) => b[1].u - a[1].u).slice(0, 12).map(([k, x]) => { const [ins, lote] = k.split("|"); return `<tr><td>${ins[0].toUpperCase() + ins.slice(1)}</td><td class="mono"><a href="#" data-a="trazaLote" data-q="${esc(lote)}">${esc(lote)}</a></td><td class="num">${x.ops}</td><td class="num">${n0(x.u)}</td></tr>`; }))}</div>

function estadoInsumo(m) {
  const st = S.insumos[m.cod], dia = m.anio26 / 240, plazo = +(m.pmax || m.pmin || 10);
  if (!dia) return { k: "gr", t: "sin consumo en " + D.anio, cob: null };
  const cob = st.stock / dia;
  // criterio: pedir cuando la cobertura no llega al plazo máximo más la mitad
  return cob < plazo ? { k: "no", t: "pedir ya", cob } : cob < plazo * 1.5 ? { k: "av", t: "pedir", cob } : { k: "ok", t: "ok", cob };
}

  if (d) { e.preventDefault(); $("#resq").hidden = true; return abrirDetalle(d.dataset.det, d.dataset.det === "equipo" && /^\d+$/.test(d.dataset.id) ? +d.dataset.id : d.dataset.id); }
  const a = e.target.closest("[data-a]");
  if (a && ACC[a.dataset.a]) { if (a.tagName === "A" || a.type === "button" || a.tagName === "BUTTON") e.preventDefault(); ACC[a.dataset.a](a); guardar(); }
  if (!e.target.closest(".buscar")) $("#resq").hidden = true;
});
document.addEventListener("change", e => { const el = e.target.closest("[data-cambio]"); if (el && ACC[el.dataset.cambio]) ACC[el.dataset.cambio](el); });
let tIn;
document.addEventListener("input", e => {
  if (e.target.id === "q") return pintarBusqueda();
  const k = e.target.dataset.in; if (!k) return;
  UI.f[k] = e.target.value; UI.pag[UI.vista] = 0;
  clearTimeout(tIn); tIn = setTimeout(() => { const id = e.target.id; pintar(); const el = document.getElementById(id); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }, 220);
});
document.addEventListener("submit", e => { const f = e.target.dataset.f; if (!f || !FORM[f]) return; e.preventDefault(); FORM[f](); guardar(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (UI.det) ACC.cerrarDetalle(); $("#resq").hidden = true; }
  if (e.key === "Enter" && e.target.id === "q" && RES[0]) { e.preventDefault(); ACC.irRes({ dataset: { i: 0 } }); }
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
});

// página pública del QR de la etiqueta (/m/<serie>): lo que ve quien escanea el equipo, sin datos del dueño
function paginaPublica(txt) {
  const n = numSerie(txt), e = n ? equipo(n) : null;
  document.body.innerHTML = `<main style="max-width:480px;margin:0 auto;padding:24px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;align-items:center;gap:10px">${logo(34)}<b style="font:800 24px/1 var(--f-display);font-style:italic;letter-spacing:.06em">FLAMA</b></div>
    ${!e ? `<div class="aviso av">No encontramos el equipo ${esc(txt)}.</div>` : e.estado === "Rechazado" ? `<div class="aviso no"><b>${e.s}</b>: este número fue rechazado en fábrica y no salió a la venta. Si está instalado, no lo uses y avisá a FLAMA.</div>` :
    `<div class="panel"><div class="cuerpo" style="display:flex;flex-direction:column;gap:10px"><div style="font:700 26px/1 var(--f-mono)">${e.s}</div><div class="muted">${esc(e.o.modelo)} · fuegos A, B y C</div>
      ${pill(e.mant && new Date(e.mant) < HOY ? "Mantenimiento vencido" : "Vigente", e.mant && new Date(e.mant) < HOY ? "no" : "ok")}
      <dl class="dl"><dt>Fabricado</dt><dd>${fecha(e.fab)}</dd><dt>Mantenimiento</dt><dd>vence ${fecha(e.mant)}</dd><dt>Prueba hidráulica</dt><dd>vence ${fecha(e.phVence)}</dd><dt>Vida útil</dt><dd>hasta ${fecha(e.vida)}</dd></dl></div></div>
      <p class="muted" style="margin:0;font-size:12.5px">Revisalo una vez por mes: precinto y seguro puestos, aguja del manómetro en verde, sin golpes ni óxido, tarjeta oficial sana. Para servicio o reclamos, contactá a tu distribuidor o a FLAMA con este número.</p>`}</main>`;
}

const ruta = location.pathname.match(/\/m\/([^/]+)\/?$/);
if (ruta) paginaPublica(decodeURIComponent(ruta[1]));
else {
  const [v, p] = desdeHash(location.hash.slice(1));
  UI.vista = v; UI.param = p;
  window.addEventListener("hashchange", () => { const [k, q] = desdeHash(location.hash.slice(1)); if (hashDe(k, q) !== hashDe(UI.vista, UI.param)) ir(k, q); });
  pintar();
}

</script>

<style>
/* Layout: barra lateral grafito con los módulos · barra superior con búsqueda global · contenido en tablas densas ·
   panel lateral derecho para el detalle de cada registro */
:root {
  --bg: #F1F3F4;
  --surface: #FFFFFF;
  --surface-2: #F6F7F8;
  --ink: #161A1D;
  --ink-2: #4A545B;
  --ink-3: #7B868E;
  --line: #DDE2E5;
  --red: #C8241A;
  --red-soft: #FBE6E3;
  --yellow: #B07F00;
  --yellow-soft: #FFF2C7;
  --green: #1F7445;
  --green-soft: #E0F2E7;
  --blue: #1D5B8C;
  --blue-soft: #E2EDF6;
  --violet: #6A4C93;
  --violet-soft: #EEE8F6;
  --side: #15191C;
  --side-2: #20262B;
  --side-ink: #E9EDEF;
  --side-ink-2: #98A4AC;
  --sel: #FFF6E0;
  --shadow: 0 1px 2px rgb(22 26 29 / 6%), 0 12px 32px rgb(22 26 29 / 14%);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1316; --surface: #171C20; --surface-2: #1D2328; --ink: #E7ECEE; --ink-2: #AAB6BE; --ink-3: #7F8C96; --line: #2A333A;
  --red: #FF6A5C; --red-soft: #3A1A18; --yellow: #F2C230; --yellow-soft: #3A3014; --green: #4CC27D; --green-soft: #15301F;
  --blue: #6DB2E6; --blue-soft: #15283A; --violet: #B79BE0; --violet-soft: #2A2238; --side: #0A0D0F; --side-2: #161B1F; --sel: #2E2914;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 12px 32px rgb(0 0 0 / 45%); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1316; --surface: #171C20; --surface-2: #1D2328; --ink: #E7ECEE; --ink-2: #AAB6BE; --ink-3: #7F8C96; --line: #2A333A;
  --red: #FF6A5C; --red-soft: #3A1A18; --yellow: #F2C230; --yellow-soft: #3A3014; --green: #4CC27D; --green-soft: #15301F;
  --blue: #6DB2E6; --blue-soft: #15283A; --violet: #B79BE0; --violet-soft: #2A2238; --side: #0A0D0F; --side-2: #161B1F; --sel: #2E2914;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 12px 32px rgb(0 0 0 / 45%); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--side) }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 12.5px }
.num { text-align: right; font-variant-numeric: tabular-nums }
.muted { color: var(--ink-3) }
h1, h2, h3 { text-wrap: balance; margin: 0 }

/* ---------- estructura */
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; background: linear-gradient(90deg, var(--side) 228px, transparent 228px) }
.lateral { background: var(--side); color: var(--side-ink); position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 14px 10px 18px max(10px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px }
.marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 10px; border-bottom: 1px solid #2A3238 }
.marca b { font: 800 22px/1 var(--f-display); letter-spacing: .06em; font-style: italic }
.marca small { display: block; font: 500 11px/1.2 var(--f-body); color: var(--side-ink-2); letter-spacing: .03em; margin-top: 2px }
.grupo-nav h6 { margin: 0 0 4px; padding: 0 8px; font: 600 10.5px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: #6E7B84 }
.grupo-nav a { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 6px; color: var(--side-ink-2); text-decoration: none; font-weight: 500 }
.grupo-nav a:hover { background: var(--side-2); color: var(--side-ink) }
.grupo-nav a[aria-current="page"] { background: var(--side-2); color: #fff; box-shadow: inset 3px 0 0 var(--red) }
.grupo-nav a svg { width: 16px; height: 16px; flex: none; opacity: .85 }
.grupo-nav a .cnt { margin-left: auto; font: 600 11px/1 var(--f-mono); background: #2E363C; color: var(--side-ink); padding: 3px 6px; border-radius: 999px }
.grupo-nav a .cnt.alerta { background: var(--red); color: #fff }
.principal { min-width: 0; display: flex; flex-direction: column }
.superior { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)) }
.buscar { flex: 1; max-width: 520px; position: relative }
.buscar input { width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 12px 8px 34px }
.buscar svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-3) }
.res-busqueda { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); max-height: 340px; overflow-y: auto; z-index: 20 }
.res-busqueda button { display: grid; grid-template-columns: 90px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; border-bottom: 1px solid var(--line) }
.res-busqueda button:hover { background: var(--surface-2) }
.periodo { font: 600 13px/1 var(--f-body); color: var(--ink-2); white-space: nowrap }
.usuario { display: flex; align-items: center; gap: 8px; margin-left: auto; white-space: nowrap; font-size: 13px }
.usuario i { width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font: 700 11px/1 var(--f-body); font-style: normal }
.prueba { font: 600 10.5px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--yellow); background: var(--yellow-soft); padding: 5px 7px; border-radius: 4px; white-space: nowrap }
.contenido { padding-block: 20px 40px; padding-left: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; min-width: 0 }
.cab { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.cab h1 { font: 700 30px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase }
.cab .sub { color: var(--ink-3); font-size: 13px; margin-top: 4px }
.acciones { display: flex; gap: 8px; flex-wrap: wrap }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .lateral { position: static; height: auto; flex-direction: row; overflow-x: auto; padding: 8px max(10px, env(safe-area-inset-left, 0px)) }
  .marca { border: 0; padding: 4px 8px } .marca small { display: none }
  .grupo-nav { display: flex; align-items: center; gap: 2px } .grupo-nav h6 { display: none }
  .grupo-nav a { white-space: nowrap } .grupo-nav a svg { display: none }
  .app { background: none } .superior { flex-wrap: wrap } .usuario span { display: none } .buscar { order: 9; flex-basis: 100%; max-width: none }
}

/* ---------- piezas */
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 12px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); text-decoration: none; white-space: nowrap }
.btn:hover { border-color: var(--ink-3) }
.btn.pri { background: var(--red); border-color: var(--red); color: #fff }
.btn.ok { background: var(--green); border-color: var(--green); color: #fff }
.btn.sm { padding: 4px 9px; font-size: 12px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0 }
.panel > header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.panel > header h2 { font: 700 17px/1 var(--f-display); letter-spacing: .04em; text-transform: uppercase }
.panel > .cuerpo { padding: 12px 14px }
.grilla { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)) }
.c4 { grid-column: span 4 } .c5 { grid-column: span 5 } .c6 { grid-column: span 6 } .c7 { grid-column: span 7 } .c8 { grid-column: span 8 } .c12 { grid-column: span 12 }
@media (max-width: 1100px) { .c4, .c5, .c6, .c7, .c8 { grid-column: span 12 } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; border-left: 4px solid var(--line); text-decoration: none; color: inherit }
.kpi.ok { border-left-color: var(--green) } .kpi.av { border-left-color: var(--yellow) } .kpi.no { border-left-color: var(--red) } .kpi.in { border-left-color: var(--blue) }
.kpi span { font-size: 12px; color: var(--ink-2) }
.kpi b { font: 700 28px/1.05 var(--f-display); font-variant-numeric: tabular-nums }
.kpi small { font-size: 11.5px; color: var(--ink-3) }
.tscroll { overflow-x: auto; min-width: 0 }
table.t { width: 100%; border-collapse: collapse; font-size: 13px }
.t th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1.5px solid var(--line); white-space: nowrap; background: var(--surface) }
.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle }
.t tr.click { cursor: pointer }
.t tr.click:hover td { background: var(--surface-2) }
.t tr.sel td { background: var(--sel) }
.t td.nw, .t th.nw, .t td.mono { white-space: nowrap }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 11.5px/1 var(--f-body); padding: 4px 8px; border-radius: 999px; white-space: nowrap }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.pill.ok { background: var(--green-soft); color: var(--green) }
.pill.no { background: var(--red-soft); color: var(--red) }
.pill.av { background: var(--yellow-soft); color: var(--yellow) }
.pill.in { background: var(--blue-soft); color: var(--blue) }
.pill.vi { background: var(--violet-soft); color: var(--violet) }
.pill.gr { background: var(--surface-2); color: var(--ink-2) }
.barra { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 80px }
.barra i { display: block; height: 100%; background: var(--blue) }
.filtros { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.filtros button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-2) }
.filtros button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.filtros input, .filtros select { border: 1.5px solid var(--line); border-radius: 7px; padding: 5px 9px; background: var(--surface); font-size: 13px; min-width: 0 }
.campo { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2) }
.campo input, .campo select, .campo textarea { border: 1.5px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--surface); color: var(--ink); min-width: 0; font-size: 13.5px }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.form .ancho { grid-column: 1 / -1 }
.aviso { border-radius: 8px; padding: 9px 11px; font-size: 13px }
.aviso.ok { background: var(--green-soft); color: var(--green) } .aviso.no { background: var(--red-soft); color: var(--red) }
.aviso.av { background: var(--yellow-soft); color: var(--ink) } .aviso.in { background: var(--blue-soft); color: var(--blue) }
.dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 0; font-size: 13px }
.dl dt { color: var(--ink-3) } .dl dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
@media (max-width: 600px) { .qrgrid { grid-template-columns: minmax(0, 1fr) !important } .qrgrid > .qr { max-width: 160px } .dl { grid-template-columns: 100px 1fr } }
.lista-alertas { list-style: none; margin: 0; padding: 0 }
.lista-alertas li { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: start; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px }
.lista-alertas li:last-child { border: 0 }
.lista-alertas li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--yellow) }
.lista-alertas li.no::before { background: var(--red) } .lista-alertas li.in::before { background: var(--blue) }
.etapas { display: flex; gap: 2px; flex-wrap: wrap }
.etapas span { font: 600 11px/1 var(--f-body); padding: 6px 8px; background: var(--surface-2); color: var(--ink-3); border-radius: 4px }
.etapas span.hecha { background: var(--green-soft); color: var(--green) }
.etapas span.actual { background: var(--ink); color: var(--bg) }
.tl { list-style: none; margin: 0; padding: 0 }
.tl li { display: grid; grid-template-columns: 92px 14px 1fr; gap: 8px; padding: 6px 0; font-size: 13px }
.tl li i { width: 10px; height: 10px; border-radius: 50%; background: var(--green); margin-top: 4px; font-style: normal }
.tl li.no i { background: var(--red) } .tl li.p i { background: var(--surface); border: 2px solid var(--line) }
.tl li time { color: var(--ink-3); font: 12px/1.4 var(--f-mono) }
.series { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 4px }
.series span { font: 11.5px/1 var(--f-mono); padding: 6px 4px; border-radius: 4px; background: var(--surface-2); text-align: center }
.series span.no { background: var(--red-soft); color: var(--red); font-weight: 600 }
.series span.ok { background: var(--green-soft); color: var(--green) }
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(210px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px }
.col-k { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 8px; min-height: 160px }
.col-k h3 { font: 700 13px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; padding: 4px 4px 2px }
.tarjeta { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; text-align: left; display: flex; flex-direction: column; gap: 3px }
.tarjeta:hover { border-color: var(--ink-3) }
.tarjeta b { font: 600 12px/1.2 var(--f-mono) }
.lector { display: flex; gap: 8px }
.lector input { flex: 1; min-width: 0; font: 600 20px/1 var(--f-mono); padding: 11px 13px; border: 2px dashed var(--blue); border-radius: 8px; background: var(--blue-soft); color: var(--ink) }
.etq { display: grid; grid-template-columns: 78px 1fr; gap: 10px; align-items: center; background: #fff; color: #111; border: 1px solid #cfd6db; border-radius: 6px; padding: 8px 10px; width: 260px; max-width: 100% }
.etq b { font: 700 11.5px/1.1 var(--f-body) } .etq .n { font: 700 17px/1.1 var(--f-mono) } .etq small { font-size: 10.5px; color: #444 }
.etq svg, .qr svg { display: block; width: 100%; height: auto }
pre.salida { margin: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: 12px/1.5 var(--f-mono); overflow-x: auto; max-height: 360px }
.paginas { display: flex; gap: 6px; align-items: center; justify-content: flex-end; padding: 10px 14px; font-size: 12.5px; color: var(--ink-3) }

/* panel de detalle */
.velo { position: fixed; inset: 0; background: rgb(10 13 15 / 38%); z-index: 40 }
.detalle { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--surface); z-index: 41; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px) }
.detalle > header { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line) }
.detalle > header h2 { font: 700 22px/1.05 var(--f-display); letter-spacing: .02em }
.detalle > header .sub { color: var(--ink-3); font-size: 12.5px; margin-top: 3px }
.detalle > header .cerrar { margin-left: auto; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--ink-3); padding: 2px 6px }
.detalle > .cuerpo { padding: 14px 16px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px }
.detalle h3 { font: 700 13px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px }
.detalle > footer { border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 13px; z-index: 60; box-shadow: var(--shadow) }
.graf { width: 100%; height: auto; display: block }
.graf text { fill: var(--ink-3); font: 11px var(--f-body) }
.graf .t-ink { fill: var(--ink) }
.graf .grid { stroke: var(--line) }
</style>

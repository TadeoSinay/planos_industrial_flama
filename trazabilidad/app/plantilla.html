<style>
/* Layout: banda superior con el lote · columna de pasos · escena con el dispositivo real · ficha del paso con lo que se escribe */
:root {
  --bg: #E9EDF0;          /* chapa granallada */
  --surface: #FFFFFF;
  --surface-2: #F3F6F8;
  --ink: #162027;
  --ink-2: #4B5A66;
  --ink-3: #7A8995;
  --line: #D3DBE1;
  --red: #C42A1E;         /* rojo matafuego */
  --red-soft: #FBE7E4;
  --yellow: #E2A800;      /* faja de sustituto */
  --yellow-soft: #FFF4D1;
  --green: #22764A;
  --green-soft: #E2F3E8;
  --blue: #1D5B8C;
  --blue-soft: #E3EEF7;
  --paper: #FCFBF7;
  --lcd: #0F2A1E;
  --lcd-ink: #8FF0B4;
  --shadow: 0 1px 2px rgb(22 32 39 / 6%), 0 8px 24px rgb(22 32 39 / 8%);
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-hand: "Caveat", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1418; --surface: #172026; --surface-2: #1D272E; --ink: #E6ECEF; --ink-2: #A5B3BD; --ink-3: #7D8C97;
  --line: #2B363E; --red: #FF5B4D; --red-soft: #3A1B19; --yellow: #F2C230; --yellow-soft: #3A3014; --green: #4CC27D;
  --green-soft: #173225; --blue: #6DB2E6; --blue-soft: #16293A; --paper: #F4F1E8; --lcd: #0B1F16; --lcd-ink: #8FF0B4;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 10px 30px rgb(0 0 0 / 35%); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1418; --surface: #172026; --surface-2: #1D272E; --ink: #E6ECEF; --ink-2: #A5B3BD; --ink-3: #7D8C97;
  --line: #2B363E; --red: #FF5B4D; --red-soft: #3A1B19; --yellow: #F2C230; --yellow-soft: #3A3014; --green: #4CC27D;
  --green-soft: #173225; --blue: #6DB2E6; --blue-soft: #16293A; --paper: #F4F1E8; --lcd: #0B1F16; --lcd-ink: #8FF0B4;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 10px 30px rgb(0 0 0 / 35%); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink) }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* ---------- banda superior */
.top { background: var(--ink); color: #EEF2F4; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5 }
:root[data-theme="dark"] .top, :root:not([data-theme="light"]) .top { }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-block: 12px; max-width: 1480px; margin: 0 auto }
.marca { display: flex; align-items: center; gap: 10px; min-width: 0 }
.marca svg { flex: none }
.marca b { font: 700 22px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase }
.marca span { display: block; font-size: 12px; color: #A9B6BF }
.lote { display: flex; align-items: center; gap: 14px; margin-left: auto; flex-wrap: wrap }
.chip { font: 600 12px/1 var(--f-mono); padding: 6px 9px; border-radius: 4px; background: #24323B; color: #EEF2F4; white-space: nowrap }
.barra { display: flex; height: 10px; width: 260px; max-width: 70vw; border-radius: 2px; overflow: hidden; background: #2C3A44 }
.barra i { display: block; height: 100% }
.leyenda { display: flex; gap: 12px; font-size: 11.5px; color: #C9D3D9; flex-wrap: wrap }
.leyenda i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.ejemplo { font-size: 11.5px; color: #F6C64A; font-weight: 600; letter-spacing: .04em; text-transform: uppercase }

/* ---------- grilla principal */
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr) 380px; gap: 22px; max-width: 1480px; margin: 0 auto; padding-block: 22px 40px }
@media (max-width: 1240px) { .app { grid-template-columns: 230px minmax(0, 1fr) } .ficha { grid-column: 1 / -1 } }
@media (max-width: 820px) { .app { grid-template-columns: minmax(0, 1fr) } }

/* ---------- lista de pasos */
.pasos { display: flex; flex-direction: column; gap: 18px; align-self: start; position: sticky; top: 86px }
@media (max-width: 820px) { .pasos { position: static; flex-direction: row; overflow-x: auto; gap: 14px; padding-bottom: 6px } }
.grupo h3 { font: 600 12px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px }
.grupo ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px }
@media (max-width: 820px) { .grupo ol { flex-direction: row } .grupo { flex: none } }
.paso-btn { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 0; background: none; padding: 7px 8px; border-radius: 6px; color: var(--ink-2) }
.paso-btn:hover { background: var(--surface) }
.paso-btn .n { font: 700 15px/1 var(--f-display); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%;
  border: 1.5px solid var(--line); color: var(--ink-3); background: var(--surface) }
.paso-btn .t { font-size: 13.5px; line-height: 1.25 }
.paso-btn .t small { display: block; font-size: 11.5px; color: var(--ink-3) }
.paso-btn[aria-current="step"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow) }
.paso-btn[aria-current="step"] .n { background: var(--red); border-color: var(--red); color: #fff }
.paso-btn.hecho .n { background: var(--green-soft); border-color: var(--green); color: var(--green) }
@media (max-width: 820px) { .paso-btn { width: auto; white-space: nowrap } .paso-btn .t small { display: none } }

/* ---------- escena */
.escena { min-width: 0; display: flex; flex-direction: column; gap: 16px }
.cab .ceja { font: 600 12px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--red) }
.cab h1 { font: 700 clamp(28px, 3.4vw, 40px)/1.02 var(--f-display); margin: 6px 0 6px; text-wrap: balance; letter-spacing: .005em }
.cab p { margin: 0; color: var(--ink-2); max-width: 70ch }
.nav { display: flex; justify-content: space-between; gap: 10px }
.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 6px; padding: 9px 14px; font-weight: 600; font-size: 14px }
.btn:hover { border-color: var(--ink-3) }
.btn.pri { background: var(--red); border-color: var(--red); color: #fff }
.btn.ok { background: var(--green); border-color: var(--green); color: #fff }
.btn.sm { padding: 6px 10px; font-size: 13px }
.btn:disabled { opacity: .45; cursor: not-allowed }

/* ---------- marcos de dispositivo */
.escenario { background: radial-gradient(120% 90% at 50% 0%, var(--surface-2), var(--bg)); border-radius: 14px; padding: 26px 18px; display: grid; place-items: center; border: 1px solid var(--line) }
.pc { width: 100%; max-width: 860px; border-radius: 10px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line) }
.pc-bar { display: flex; align-items: center; gap: 7px; padding: 9px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line) }
.pc-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line) }
.pc-bar .url { margin-left: 10px; font: 12px/1 var(--f-mono); color: var(--ink-3); background: var(--surface); padding: 6px 10px; border-radius: 5px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pc-in { padding: 20px 22px; min-height: 380px }
.tel { width: 340px; max-width: 100%; border-radius: 38px; padding: 12px; background: #1B2228; box-shadow: var(--shadow) }
.tel-in { border-radius: 28px; overflow: hidden; background: var(--surface); min-height: 600px; display: flex; flex-direction: column }
.tel-top { height: 26px; display: grid; place-items: center }
.tel-top i { width: 90px; height: 6px; border-radius: 3px; background: var(--line) }
.tel-body { padding: 8px 18px 22px; display: flex; flex-direction: column; gap: 12px; flex: 1 }
.hoja { width: 100%; max-width: 720px; background: var(--paper); color: #1d2328; padding: 26px 30px; box-shadow: 0 2px 4px rgb(0 0 0 / 10%), 0 18px 40px rgb(0 0 0 / 14%); border-radius: 2px; transform: rotate(-.35deg) }
.maquina { width: 100%; max-width: 640px; background: linear-gradient(#3B464E, #2A333A); border-radius: 12px; padding: 18px; box-shadow: var(--shadow) }
.maquina .lcd { background: var(--lcd); color: var(--lcd-ink); font-family: var(--f-mono); border-radius: 6px; padding: 16px 18px; min-height: 230px; box-shadow: inset 0 0 0 2px #061109 }
.maquina .placa { display: flex; justify-content: space-between; color: #C9D3D9; font: 600 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px }

/* ---------- piezas de pantalla */
.h2 { font: 700 22px/1.1 var(--f-display); margin: 0 0 4px; letter-spacing: .01em }
.sub { color: var(--ink-3); font-size: 13px; margin: 0 0 14px }
.tabla { width: 100%; border-collapse: collapse; font-size: 13.5px }
.tabla th { text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 7px 8px; border-bottom: 1.5px solid var(--line) }
.tabla td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top }
.tabla td.num, .tabla th.num { text-align: right; font-variant-numeric: tabular-nums }
.tscroll { overflow-x: auto; min-width: 0 }
.pill { display: inline-block; font: 600 11.5px/1 var(--f-body); padding: 4px 7px; border-radius: 999px; white-space: nowrap }
.pill.ok { background: var(--green-soft); color: var(--green) }
.pill.no { background: var(--red-soft); color: var(--red) }
.pill.av { background: var(--yellow-soft); color: #8A6400 }
:root[data-theme="dark"] .pill.av { color: var(--yellow) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.av { color: var(--yellow) } }
.pill.in { background: var(--blue-soft); color: var(--blue) }
.fila { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.campo { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2) }
.campo input, .campo select { border: 1.5px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); color: var(--ink); min-width: 0 }
.aviso { border-radius: 8px; padding: 10px 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: flex-start }
.aviso.ok { background: var(--green-soft); color: var(--green) }
.aviso.no { background: var(--red-soft); color: var(--red) }
.aviso.av { background: var(--yellow-soft); color: #7A5900 }
:root[data-theme="dark"] .aviso.av { color: var(--yellow) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .aviso.av { color: var(--yellow) } }
.aviso.in { background: var(--blue-soft); color: var(--blue) }
.grande { font: 700 34px/1 var(--f-display); letter-spacing: .02em }
.lector { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap }
.lector input { flex: 1; min-width: 180px; font: 600 22px/1 var(--f-mono); padding: 12px 14px; border: 2px dashed var(--blue); border-radius: 8px; background: var(--blue-soft); color: var(--ink) }
.dos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px }
@media (max-width: 640px) { .dos { grid-template-columns: minmax(0, 1fr) } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px }
.kpi { background: var(--surface-2); border-radius: 8px; padding: 10px 12px }
.kpi b { display: block; font: 700 26px/1 var(--f-display) }
.kpi span { font-size: 12px; color: var(--ink-3) }

/* etiqueta impresa */
.etq { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; background: #fff; color: #111; border-radius: 6px; padding: 10px 12px; border: 1px solid #cfd6db; width: 300px; max-width: 100%; box-shadow: 0 2px 6px rgb(0 0 0 / 12%) }
.etq .qr svg { width: 96px; height: 96px; display: block }
.etq b { font: 700 13px/1.1 var(--f-body); letter-spacing: .02em }
.etq .num { font: 700 21px/1.05 var(--f-mono); margin: 3px 0 }
.etq small { font-size: 11px; color: #444 }
.etiquetas { display: flex; gap: 10px; flex-wrap: wrap }

/* hoja de ruta en papel */
.hoja h2 { font: 700 22px/1 var(--f-display); margin: 0; letter-spacing: .02em; text-transform: uppercase }
.hoja .meta { font-size: 12.5px; margin: 6px 0 14px }
.hoja table { border-collapse: collapse; width: 100%; font-size: 12px }
.hoja td, .hoja th { border: 1px solid #9aa4ab; padding: 4px 6px; text-align: left }
.hoja th { background: #eef0ee; font-weight: 600 }
.mano { font-family: var(--f-hand); font-size: 19px; color: #1d4f8c; line-height: 1 }
.mano.rojo { color: #b3261e }
.hoja td.mono { white-space: nowrap; font-size: 10.5px !important }
.tabla td.nw { white-space: nowrap }
.caja-tilde { width: 22px; height: 20px; text-align: center; padding: 0 !important; cursor: pointer }
.series-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 14px }
@media (max-width: 640px) { .series-grid { grid-template-columns: minmax(0, 1fr) } }
.qrbox svg { display: block }

/* ---------- ficha lateral */
.ficha { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px }
.card h4 { margin: 0 0 8px; font: 600 12px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3) }
.dl { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; font-size: 13.5px; margin: 0 }
.dl dt { color: var(--ink-3) }
.dl dd { margin: 0 }
.sheet { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface) }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12.5px }
.sheet-head .ic { width: 16px; height: 16px; border-radius: 3px; background: var(--green); display: grid; place-items: center; color: #fff; font-size: 10px; font-weight: 700 }
.sheet-head .ic.db { background: var(--blue) }
.sheet table { border-collapse: collapse; width: 100%; font: 11.5px/1.3 var(--f-mono) }
.sheet th { background: var(--surface-2); color: var(--ink-3); font-weight: 600; text-align: left; padding: 5px 7px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: nowrap }
.sheet td { padding: 5px 7px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); white-space: nowrap }
.sheet tr.nuevo td { background: var(--yellow-soft) }
.sheet .tabs { display: flex; gap: 2px; padding: 0 6px; background: var(--surface-2); border-top: 1px solid var(--line); font-size: 11.5px; overflow-x: auto }
.sheet .tabs span { padding: 5px 9px; color: var(--ink-3); white-space: nowrap }
.sheet .tabs span.on { background: var(--surface); color: var(--green); font-weight: 600; border-bottom: 2px solid var(--green) }

/* ---------- registro */
.registro { max-width: 1480px; margin: 0 auto 40px }
.registro details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px }
.registro summary { padding: 12px 16px; cursor: pointer; font-weight: 600 }
.registro .tscroll { padding: 0 16px 14px }
.hash { color: var(--ink-3) }
@media (prefers-reduced-motion: no-preference) { .nuevo-in { animation: entra .35s ease-out } @keyframes entra { from { transform: translateY(6px); opacity: .4 } to { transform: none; opacity: 1 } } }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px }
.tl li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; font-size: 13px }
.tl li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--green); margin-top: 4px }
.tl li.r::before { background: var(--red) }
.tabs-tel { display: flex; border-bottom: 1px solid var(--line) }
.tabs-tel button { flex: 1; border: 0; background: none; padding: 8px; font-weight: 600; color: var(--ink-3); border-bottom: 2px solid transparent }
.tabs-tel button[aria-selected="true"] { color: var(--red); border-color: var(--red) }
.estado-grande { border-radius: 10px; padding: 14px; text-align: center }
.arq { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: stretch }
@media (max-width: 760px) { .arq { grid-template-columns: minmax(0, 1fr) } }
.arq .col { display: flex; flex-direction: column; gap: 8px }
.arq .blk { border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 13px; background: var(--surface) }
.arq .blk b { display: block; font-size: 13.5px }
.arq .blk.s { border-color: var(--green) }
.arq .blk.d { border-color: var(--blue) }
.arq .blk.p { border-color: var(--red) }
.arq h5 { margin: 0; font: 600 11.5px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3) }
</style>

<header class="top">
  <div class="top-in wrap">
    <div class="marca">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="10" y="9" width="14" height="22" rx="6" fill="#C42A1E"/><rect x="14" y="4" width="6" height="6" rx="1" fill="#C9D3D9"/><path d="M20 6h7v3h-7z" fill="#C9D3D9"/><rect x="11" y="24" width="12" height="2.2" fill="#111"/></svg>
      <div><b>FLAMA · Trazabilidad</b><span>Prueba de concepto · recorrido de un lote real del Plan mensual</span></div>
    </div>
    <div class="lote">
      <span class="ejemplo">Datos de ejemplo</span>
      <span class="chip" id="chipLote">—</span>
      <div>
        <div class="barra" id="barra" aria-label="Estado de los equipos del lote"></div>
        <div class="leyenda" id="leyenda"></div>
      </div>
    </div>
  </div>
</header>

<div class="app wrap">
  <nav class="pasos" id="pasos" aria-label="Pasos del recorrido"></nav>
  <main class="escena">
    <div class="cab"><div class="ceja" id="ceja"></div><h1 id="titulo"></h1><p id="bajada"></p></div>
    <div class="escenario" id="escenario"></div>
    <div class="nav"><button class="btn" id="ant">← Paso anterior</button><button class="btn pri" id="sig">Paso siguiente →</button></div>
  </main>
  <aside class="ficha" id="ficha"></aside>
</div>

<section class="registro wrap">
  <details open>
    <summary>Registro de eventos de esta sesión (cada uno guarda el hash del anterior)</summary>
    <div class="tscroll"><table class="tabla" id="registro"><thead><tr><th>#</th><th>Hora</th><th>Evento</th><th>Referencia</th><th>Puesto / quién</th><th>Hash (SHA-256)</th></tr></thead><tbody></tbody></table></div>
  </details>
</section>

<script>
const D = /*__DATOS__*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n0 = x => Math.round(x).toLocaleString("es-AR");
const nf = (x, d = 2) => Number(x).toLocaleString("es-AR", { minimumFractionDigits: d, maximumFractionDigits: d });
const DEMO = D.demo, SERIES = DEMO.series, REJ = SERIES[16];   // el equipo 17 del lote falla la prueba hidráulica
const OTRO = SERIES[30];                                         // el que se usa para la inutilización (años después)
const AA = String(D.anio).slice(2);

function qr(key, size = 96) {
  const q = D.qr[key]; if (!q) return "";
  return `<svg viewBox="-2 -2 ${q.n + 4} ${q.n + 4}" width="${size}" height="${size}" role="img" aria-label="QR ${esc(key)}"><rect x="-2" y="-2" width="${q.n + 4}" height="${q.n + 4}" fill="#fff"/><path d="${q.d}" fill="#000"/></svg>`;
}
function dm(texto, size = 64) {           // DataMatrix ilustrativo (patrón con borde en L), solo para mostrar
  let h = 0; for (const c of texto) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  let r = ""; const n = 18;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    h = (h * 1103515245 + 12345) >>> 0;
    const on = j === 0 || i === n - 1 || (i === 0 && j % 2 === 0) || (j === n - 1 && i % 2 === 1) || (i > 0 && j > 0 && i < n - 1 && j < n - 1 && (h >> 16) % 2);
    if (on) r += `<rect x="${j}" y="${i}" width=".9" height=".9"/>`;
  }
  return `<svg viewBox="0 0 18 18" width="${size}" height="${size}" aria-hidden="true"><g fill="currentColor">${r}</g></svg>`;
}

  cajas: 0, pallet: false, despachado: false, cot: "", salida: false, recibido: false, danio: false,

async function sha(t) {
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch (e) { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h.toString(16).padStart(8, "0") + "…"; }
}
async function evento(tipo, ref, quien, datos = {}) {
  const prev = S.eventos.length ? S.eventos[S.eventos.length - 1].hash : "0".repeat(64);
  const hora = new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const e = { n: S.eventos.length + 1, hora, tipo, ref, quien, datos };
  e.hash = await sha(prev + JSON.stringify(e));
  S.eventos.push(e); pintarRegistro(); pintarBarra();
}
function pintarRegistro() {
  $("#registro tbody").innerHTML = S.eventos.slice().reverse().map(e => `<tr class="nuevo-in"><td class="mono">${e.n}</td><td class="mono">${e.hora}</td><td>${esc(e.tipo)}</td><td class="mono">${esc(e.ref)}</td><td>${esc(e.quien)}</td><td class="mono hash">${e.hash.slice(0, 16)}…</td></tr>`).join("")
    || `<tr><td colspan="6" style="color:var(--ink-3)">Todavía no hay eventos. Confirmá la orden en el paso 1 y seguí el recorrido: cada acción queda acá.</td></tr>`;
}

// ---------------------------------------------------------------- estado de cada equipo (para la barra)
function estados() {
  const c = { reservado: 0, grabado: 0, rechazo: 0, identificado: 0, despachado: 0 };
  SERIES.forEach((s, i) => {
    if (S.cerrado && s === REJ) c.rechazo++;
    else if (S.despachado && S.impresos.includes(s)) c.despachado++;
    else if (S.impresos.includes(s)) c.identificado++;
    else if (i < S.grabados) c.grabado++;
    else c.reservado++;
  });
  return c;
}

// ---------------------------------------------------------------- hoja de ruta (papel)
function hojaRuta(interactiva) {
  const fila = (p, ins, f) => `<tr><td>${p}</td><td>${ins}</td><td class="mano">${f ? "12/03" : ""}</td><td class="mano">${f ? "J. Pérez" : ""}</td></tr>`;
  const col = arr => `<table><thead><tr><th>Serie</th><th>Esp.</th><th>PH</th><th>Carga</th><th>Pérd.</th></tr></thead><tbody>${arr.map(s => {
    const t = S.tildes[s];
    const c = (k, v) => `<td class="caja-tilde mano ${v ? "" : "rojo"}" ${interactiva ? `data-t="${s}|${k}" tabindex="0" role="button" aria-label="${s} ${k}"` : ""}>${interactiva ? (v ? "✓" : "✗") : ""}</td>`;
    return `<tr><td class="mono" style="font-size:11px">${s}</td>${c("esp", t.esp)}${c("ph", t.ph)}${c("carga", t.carga)}${c("perd", t.perd)}</tr>`; }).join("")}</tbody></table>`;
  const tercio = Math.ceil(SERIES.length / 3);
  return `<div class="hoja"><div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start"><div><h2>Hoja de ruta del lote</h2>
    <div class="meta"><b>${esc(DEMO.op)}</b> · ${esc(DEMO.modelo)} · ${SERIES.length} u · series ${SERIES[0]} a ${SERIES[SERIES.length - 1]}<br>Chapa H-0412 (colada 4521) · emitida por PCP · viaja en el carro</div></div><div class="qrbox">${qr("OP", 74)}</div></div>
    <table style="margin-bottom:12px"><thead><tr><th>Puesto</th><th>Insumo (anotar o pegar etiqueta)</th><th>Fecha</th><th>Firma</th></tr></thead><tbody>
    ${fila("2 · G2 + Pannier", `grabados ${SERIES[0].slice(-3)}–${SERIES[SERIES.length - 1].slice(-3)}`, interactiva)}${fila("4–7 · Cúpulas", `<span class="mano">CU-0303</span>`, interactiva)}${fila("8–12 · Soldaduras", `<span class="mano">AL-2602 / G-77</span>`, interactiva)}${fila("16–19 · Pintura", `<span class="mano">PP-2603-2</span>`, interactiva)}${fila("20–22 · Carga", `<span class="mano">PO-2603 / VA-118</span>`, interactiva)}</tbody></table>
    <div class="series-grid">${col(SERIES.slice(0, tercio))}${col(SERIES.slice(tercio, 2 * tercio))}${col(SERIES.slice(2 * tercio))}</div>
    <p style="font-size:12px;margin:10px 0 0">Cierre (calidad): rechazos <span class="mano rojo">${interactiva ? SERIES.filter(s => !Object.values(S.tildes[s]).every(Boolean)).join(", ") || "—" : ""}</span> · firma <span class="mano">${interactiva ? "M. Ruiz" : ""}</span></p></div>`;
}

async function leer(s) {
  s = s.trim().toUpperCase().replace(/^N°\s*/, "");
  if (/^\d{8}$/.test(s)) s = s.slice(0, 2) + "-" + s.slice(2);
  if (!S.cerrado) { S.ultimo = { s, ok: false, motivo: "lote sin cerrar" }; }
  else if (!SERIES.includes(s)) { S.ultimo = { s, ok: false, motivo: "no pertenece al lote abierto" }; }
  else if (s === REJ) { S.ultimo = { s, ok: false, motivo: "BLOQUEADO: rechazo en la prueba hidráulica" }; await evento("BLOQUEO EN ETIQUETADO", s, "puesto 24"); }
  else if (S.impresos.includes(s)) { S.ultimo = { s, ok: false, motivo: "ya tiene etiqueta (reimpresión solo con supervisor)" }; }
  else { S.impresos.push(s); S.ultimo = { s, ok: true }; await evento("IDENTIFICADO", s, "puesto 24 · lector"); }
  pintar(); const i = $("#lectura"); if (i) i.focus();
}
const ACC = {
  async confirmar() { S.opOk = true; for (const l of lotesMes().slice(0, 3)) await evento("OP EMITIDA", l.op, "PCP", { modelo: l.modelo }); await evento("SERIES RESERVADAS", `${SERIES[0]}…${SERIES[SERIES.length - 1]}`, "PCP"); pintar(); },
  async grabar1() { if (!S.opOk) { await ACC.confirmar(); } if (S.grabados < SERIES.length) { S.grabados++; await evento("GRABADO", SERIES[S.grabados - 1], "G2 · Pannier"); } pintar(); },
  async grabarTodo() { if (!S.opOk) await ACC.confirmar(); const d = S.grabados; S.grabados = SERIES.length; await evento("GRABADO (lote)", `${SERIES[d]}…${SERIES[SERIES.length - 1]}`, "G2 · Pannier"); pintar(); },
  async cerrar() { if (S.grabados < SERIES.length) { S.grabados = SERIES.length; await evento("GRABADO (lote)", DEMO.op, "G2 · Pannier"); }
    S.cerrado = true; await evento("HOJA CERRADA", DEMO.op, "calidad · celular", { foto: S.foto || "sin foto" });
    for (const s of SERIES.filter(s => !Object.values(S.tildes[s]).every(Boolean))) await evento("RECHAZO", s, "calidad"); pintar(); },
  async leerSig() { const f = SERIES.filter(s => s !== REJ && !S.impresos.includes(s)); if (f.length) await leer(f[0]); },
  async leerRech() { await leer(REJ); },
  async leerTodo() { if (!S.cerrado) return leer(SERIES[0]); const f = SERIES.filter(s => s !== REJ && !S.impresos.includes(s)); S.impresos.push(...f); S.ultimo = { s: f[f.length - 1], ok: true }; await evento("IDENTIFICADO (lote)", `${f.length} equipos`, "puesto 24 · lector"); pintar(); },
  async pallet() { S.pallet = true; S.cajas = SERIES.length - 1; await evento("PALLET CERRADO", "SSCC …0457", "puesto 25"); pintar(); },
  async despachar() { S.despachado = true; await evento("DESPACHADO", "R 0001-00004521", "depósito PT", { cot: S.cot }); pintar(); },
  async salida() { S.salida = true; await evento("EN TRÁNSITO", "SSCC …0457", "chofer · celular"); pintar(); },
  async danio() { S.danio = !S.danio; pintar(); },
  async recibir() { S.recibido = true; await evento("RECIBIDO", "SSCC …0457", "Matafuegos Sur · celular", { danio: S.danio }); pintar(); },
  async firmar() { S.instalado = Object.assign(S.instalado || { alt: 1.35, sen: 2.2 }, { firmado: true }); await evento("INSTALADO", SERIES[2], "instalador · celular"); pintar(); },
  tabCom() { S.tab = "com"; pintar(); }, tabTec() { S.tab = "tec"; pintar(); },
  rCorr() { S.recarga = Object.assign(S.recarga || { corr: false, golpe: false, hecho: false }, { corr: !(S.recarga && S.recarga.corr) }); pintar(); },
  rGolpe() { S.recarga = Object.assign(S.recarga || { corr: false, golpe: false, hecho: false }, { golpe: !(S.recarga && S.recarga.golpe) }); pintar(); },
  async servicio() { S.recarga = Object.assign(S.recarga || {}, { hecho: true }); await evento("SERVICIO · FICHA REV. 1", SERIES[2], "recargas"); pintar(); },
  async inutilizar() { S.inutil = true; await evento("INUTILIZADO · BAJA", OTRO, "recargas", { acta: "AG-27-0019" }); pintar(); },
};
document.addEventListener("click", async e => {
  const p = e.target.closest("[data-p]"); if (p) return ir(+p.dataset.p);
  const t = e.target.closest("[data-t]"); if (t) { const [s, k] = t.dataset.t.split("|"); S.tildes[s][k] = !S.tildes[s][k]; return pintar(); }
  const a = e.target.closest("[data-a]"); if (a && ACC[a.dataset.a] && a.type !== "file") { if (a.type === "checkbox") return ACC[a.dataset.a](); e.preventDefault(); return ACC[a.dataset.a](); }
});
document.addEventListener("keydown", e => { const t = e.target.closest("[data-t]"); if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); t.click(); } });
document.addEventListener("change", e => {
  if (e.target.id === "foto" && e.target.files[0]) { S.foto = e.target.files[0].name; pintar(); }
});
document.addEventListener("input", e => {
  const k = e.target.dataset.i; if (!k) return;
  if (k === "cot") S.cot = e.target.value;
  if (k === "alt" || k === "sen") { S.instalado = Object.assign(S.instalado || { alt: 1.35, sen: 2.2 }, { [k]: parseFloat(e.target.value) || 0 }); const pos = e.target.id; pintar(); const el = document.getElementById(pos); if (el) { el.focus(); const v = el.value; el.value = ""; el.value = v; } }
});
document.addEventListener("submit", e => { if (e.target.dataset.f === "leer") { e.preventDefault(); const v = $("#lectura").value; if (v) leer(v); } });
$("#ant").addEventListener("click", () => ir(S.paso - 1));
$("#sig").addEventListener("click", () => ir(S.paso + 1));
const ini = PASOS.findIndex(p => "#" + p.id === location.hash);
S.paso = ini >= 0 ? ini : 0;
pintarRegistro(); pintar();
</script>
